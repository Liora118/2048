<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #1a1a2e 100%);
    color: #e8e8e8;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; }

  .header { display: flex; align-items: flex-end; gap: 16px; width: 100%; max-width: 460px; justify-content: space-between; }
  h1 {
    font-size: 44px; font-weight: 800; letter-spacing: 2px; line-height: 1;
    background: linear-gradient(90deg, #f6b93b, #e55039);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    user-select: none;
  }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 8px;
    padding: 6px 16px;
    text-align: center;
    min-width: 72px;
  }
  .score-box .label { font-size: 11px; color: #8892a8; text-transform: uppercase; letter-spacing: 1px; }
  .score-box .val { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .score-box .val.bump { animation: bump .25s ease; }
  @keyframes bump { 0% { transform: scale(1); } 50% { transform: scale(1.25); color: #f6b93b; } 100% { transform: scale(1); } }

  .toolbar { display: flex; width: 100%; max-width: 460px; justify-content: space-between; align-items: center; }
  .desc { font-size: 13px; color: #8892a8; }
  .btn {
    padding: 8px 22px; font-size: 14px; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, #e67e22, #e55039);
    border: none; border-radius: 8px; cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 4px 14px rgba(229,80,57,.35);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(229,80,57,.5); }

  .board-area { position: relative; }
  .board {
    position: relative;
    width: min(460px, calc(100vw - 32px));
    aspect-ratio: 1;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    padding: 10px;
    display: grid;
    grid-template: repeat(4, 1fr) / repeat(4, 1fr);
    gap: 10px;
    touch-action: none;
  }
  .cell-bg { background: rgba(255,255,255,.05); border-radius: 8px; }

  .tile {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    font-weight: 800;
    transition: top .12s ease, left .12s ease;
    z-index: 1;
  }
  .tile.merged { animation: pop .2s ease; }
  .tile.new { animation: appear .2s ease; }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
  @keyframes appear { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .overlay {
    position: absolute; inset: 0;
    background: rgba(20,24,40,.82);
    backdrop-filter: blur(4px);
    border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    z-index: 10; text-align: center;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 32px; }
  .overlay .fs { font-size: 44px; font-weight: 800; color: #f6b93b; }
  .overlay p { font-size: 14px; color: #aab3c5; line-height: 1.8; }
  .overlay p kbd {
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);
    border-radius: 4px; padding: 1px 7px; color: #e8e8e8;
  }
  .tips { font-size: 12px; color: #5a6478; user-select: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box"><div class="label">得分</div><div class="val" id="score">0</div></div>
      <div class="score-box"><div class="label">最高分</div><div class="val" id="best">0</div></div>
    </div>
  </div>
  <div class="toolbar">
    <span class="desc">合并相同数字，冲击 <b style="color:#f6b93b">2048</b>！</span>
    <button class="btn" id="newBtn">新游戏</button>
  </div>
  <div class="board-area">
    <div class="board" id="board">
      <!-- 背景格 -->
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
    </div>
    <div class="overlay hidden" id="overlay">
      <h2 id="ovTitle">游戏结束</h2>
      <div class="fs" id="ovScore">0</div>
      <p id="ovText"><kbd>↑↓←→</kbd> / <kbd>WASD</kbd> 移动 · 手机滑动即可</p>
      <button class="btn" id="ovBtn">再来一局</button>
    </div>
  </div>
  <div class="tips">箭头键移动方块 · 相同数字合并加倍 · 无法移动时结束</div>
</div>

<script>
(() => {
  const SIZE = 4;
  const board = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovScore = document.getElementById('ovScore');
  const ovBtn = document.getElementById('ovBtn');
  document.getElementById('newBtn').addEventListener('click', newGame);
  ovBtn.addEventListener('click', newGame);

  let grid, score, best = +(localStorage.getItem('game2048_best') || 0), over;
  bestEl.textContent = best;

  // 配色：数值越大越暖
  const COLORS = {
    2:   {bg:'#eee4da', fg:'#776e65'}, 4:   {bg:'#ede0c8', fg:'#776e65'},
    8:   {bg:'#f2b179', fg:'#fff'},    16:  {bg:'#f59563', fg:'#fff'},
    32:  {bg:'#f67c5f', fg:'#fff'},    64:  {bg:'#f65e3b', fg:'#fff'},
    128: {bg:'#edcf72', fg:'#fff'},    256: {bg:'#edcc61', fg:'#fff'},
    512: {bg:'#edc850', fg:'#fff'},    1024:{bg:'#edc53f', fg:'#fff'},
    2048:{bg:'#edc22e', fg:'#fff'},    4096:{bg:'#3c3a32', fg:'#fff'},
    8192:{bg:'#3c3a32', fg:'#fff'}
  };

  function fontFor(v) {
    if (v < 100) return 46;
    if (v < 1000) return 38;
    return 30;
  }

  function emptyCells() {
    const cells = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (!grid[r][c]) cells.push([r, c]);
    return cells;
  }

  function addRandomTile() {
    const cells = emptyCells();
    if (!cells.length) return;
    const [r, c] = cells[Math.floor(Math.random() * cells.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    renderTile(r, c, grid[r][c], 'new');
  }

  function canMove() {
    if (emptyCells().length) return true;
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c];
        if (c < SIZE - 1 && grid[r][c + 1] === v) return true;
        if (r < SIZE - 1 && grid[r + 1][c] === v) return true;
      }
    return false;
  }

  // 对一行（数组，index 0 为移动方向前端）做压缩合并，返回 {line, gained}
  function slideLine(line) {
    const vals = line.filter(v => v);
    const out = [];
    let gained = 0;
    for (let i = 0; i < vals.length; i++) {
      if (i + 1 < vals.length && vals[i] === vals[i + 1]) {
        out.push(vals[i] * 2);
        gained += vals[i] * 2;
        i++;
      } else {
        out.push(vals[i]);
      }
    }
    while (out.length < SIZE) out.push(0);
    return { line: out, gained };
  }

  // 执行移动。dir: {dr, dc}。返回是否发生了移动
  function move(dr, dc) {
    if (over) return false;
    const oldGrid = JSON.stringify(grid);
    let gained = 0;
    const mergedFlags = Array.from({length: SIZE}, () => Array(SIZE).fill(false));

    for (let i = 0; i < SIZE; i++) {
      // 取出一条线
      const line = [];
      for (let j = 0; j < SIZE; j++) {
        const r = dr !== 0 ? j : i;
        const c = dc !== 0 ? j : i;
        line.push(grid[r][c]);
      }
      // 若方向是反向（下/右），先翻转使其"前端"对齐移动方向
      const reversed = (dc < 0) || (dr < 0);
      const work = reversed ? [...line].reverse() : line;
      const { line: res, gained: g } = slideLine(work);
      gained += g;
      const final = reversed ? [...res].reverse() : res;

      for (let j = 0; j < SIZE; j++) {
        const r = dr !== 0 ? j : i;
        const c = dc !== 0 ? j : i;
        grid[r][c] = final[j];
      }
    }

    if (JSON.stringify(grid) === oldGrid) return false;

    score += gained;
    if (score > best) {
      best = score;
      localStorage.setItem('game2048_best', best);
      bestEl.textContent = best;
    }
    updateScore(gained);
    render();
    addRandomTile();

    if (!canMove()) {
      over = true;
      setTimeout(() => showOverlay('游戏结束', score, '合并到最后啦，再试一次？'), 350);
    } else if (gained && grid.flat().includes(2048) && !reached2048) {
      reached2048 = true;
      setTimeout(() => showOverlay('🏆 你赢了！', score, '达成 2048！可以继续挑战更高分数'), 350);
    }
    return true;
  }

  let reached2048 = false;

  function updateScore(gained) {
    scoreEl.textContent = score;
    if (gained > 0) {
      scoreEl.classList.remove('bump');
      void scoreEl.offsetWidth; // 重启动画
      scoreEl.classList.add('bump');
    }
  }

  // 渲染所有格子
  function render() {
    board.querySelectorAll('.tile').forEach(t => t.remove());
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c]) renderTile(r, c, grid[r][c]);
  }

  function renderTile(r, c, v, animClass) {
    const tile = document.createElement('div');
    tile.className = 'tile' + (animClass ? ' ' + animClass : '');
    tile.textContent = v;
    const col = COLORS[v] || {bg: '#3c3a32', fg: '#fff'};
    tile.style.background = col.bg;
    tile.style.color = col.fg;
    tile.style.fontSize = fontFor(v) + 'px';
    tile.style.textShadow = v >= 8 ? '0 1px 3px rgba(0,0,0,.25)' : 'none';
    positionTile(tile, r, c);
    board.appendChild(tile);
  }

  function positionTile(tile, r, c) {
    // board 有 10px padding 和 10px gap
    const gap = 10, pad = 10;
    const w = board.clientWidth - pad * 2;
    const cell = (w - gap * 3) / 4;
    tile.style.width = cell + 'px';
    tile.style.height = cell + 'px';
    tile.style.top = (pad + r * (cell + gap)) + 'px';
    tile.style.left = (pad + c * (cell + gap)) + 'px';
  }

  function showOverlay(title, s, text) {
    ovTitle.textContent = title;
    ovScore.textContent = s;
    document.getElementById('ovText').innerHTML = text + '<br>点击按钮再来一局';
    ovBtn.textContent = '再来一局';
    overlay.classList.remove('hidden');
  }

  function newGame() {
    grid = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
    score = 0;
    over = false;
    reached2048 = false;
    updateScore(0);
    overlay.classList.add('hidden');
    addRandomTile();
    addRandomTile();
  }

  // 键盘
  const KEYMAP = {
    ArrowUp: {dr: -1, dc: 0}, ArrowDown: {dr: 1, dc: 0},
    ArrowLeft: {dr: 0, dc: -1}, ArrowRight: {dr: 0, dc: 1},
    w: {dr: -1, dc: 0}, s: {dr: 1, dc: 0}, a: {dr: 0, dc: -1}, d: {dr: 0, dc: 1},
    W: {dr: -1, dc: 0}, S: {dr: 1, dc: 0}, A: {dr: 0, dc: -1}, D: {dr: 0, dc: 1}
  };
  document.addEventListener('keydown', e => {
    const m = KEYMAP[e.key];
    if (m) { e.preventDefault(); move(m.dr, m.dc); }
  });

  // 触控滑动
  let tx = 0, ty = 0;
  board.addEventListener('touchstart', e => {
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive: true});
  board.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(0, dx > 0 ? 1 : -1);
    else move(dy > 0 ? 1 : -1, 0);
  }, {passive: true});

  // 窗口尺寸变化时重新定位所有方块
  window.addEventListener('resize', () => {
    board.querySelectorAll('.tile').forEach(t => {
      const r = Math.round((parseFloat(t.style.top) - 10) / (t.offsetHeight + 10));
      const c = Math.round((parseFloat(t.style.left) - 10) / (t.offsetWidth + 10));
      if (r >= 0 && r < SIZE && c >= 0 && c < SIZE) positionTile(t, r, c);
    });
  });

  newGame();
})();
</script>
</body>
</html>
