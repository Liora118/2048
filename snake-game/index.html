<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇 · Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 16px;
  }
  h1 {
    font-size: 26px;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    user-select: none;
  }
  .hud {
    display: flex;
    gap: 24px;
    font-size: 15px;
    background: rgba(255,255,255,.06);
    padding: 8px 20px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.08);
  }
  .hud b { color: #4ade80; font-variant-numeric: tabular-nums; }
  .board {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08);
  }
  canvas { display: block; background: #0b1220; touch-action: none; }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(8,12,22,.78);
    backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    z-index: 2;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 28px; color: #fff; }
  .overlay p { font-size: 14px; color: #94a3b8; line-height: 1.7; }
  .overlay p kbd {
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 5px;
    padding: 1px 7px;
    font-family: inherit;
    color: #e2e8f0;
  }
  .btn {
    margin-top: 6px;
    padding: 10px 34px;
    font-size: 16px;
    font-weight: 600;
    color: #052e16;
    background: linear-gradient(135deg, #4ade80, #22d3ee);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 4px 18px rgba(74,222,128,.35);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(74,222,128,.5); }
  .tips { font-size: 12px; color: #64748b; user-select: none; }
  .final-score { font-size: 40px; font-weight: 800; color: #4ade80; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🐍 贪吃蛇</h1>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>最高分 <b id="best">0</b></span>
    <span>速度 <b id="speed">1</b></span>
  </div>
  <div class="board">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">准备好了吗？</h2>
      <div class="final-score" id="ovScore" style="display:none">0</div>
      <p id="ovText">
        <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W A S D</kbd> 控制方向<br>
        <kbd>空格</kbd> 暂停 / 继续 · 手机滑动屏幕控制
      </p>
      <button class="btn" id="startBtn">开始游戏</button>
    </div>
  </div>
  <div class="tips">吃到 ✦ 加分，撞墙或咬到自己游戏结束</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const GRID = 24;                 // 每格像素
  const COLS = canvas.width / GRID; // 20
  const ROWS = canvas.height / GRID; // 20

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const speedEl = document.getElementById('speed');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const ovScore = document.getElementById('ovScore');
  const startBtn = document.getElementById('startBtn');

  let snake, dir, nextDir, food, score, best, speed, timer, state;
  best = +(localStorage.getItem('snake_best') || 0);
  bestEl.textContent = best;

  function reset() {
    snake = [{x: 9, y: 10}, {x: 8, y: 10}, {x: 7, y: 10}];
    dir = {x: 1, y: 0};
    nextDir = dir;
    score = 0;
    speed = 1;
    placeFood();
    updateHud();
  }

  function placeFood() {
    do {
      food = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function updateHud() {
    scoreEl.textContent = score;
    speedEl.textContent = speed;
  }

  function tick() {
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // 撞墙 / 咬自己
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      // 每 50 分提速一档
      const newSpeed = 1 + Math.floor(score / 50);
      const speedUp = newSpeed > speed;
      speed = newSpeed;
      placeFood();
      updateHud();
      if (speedUp) restartTimer();
      pulse();
    } else {
      snake.pop();
    }
    draw();
  }

  function restartTimer() {
    clearInterval(timer);
    timer = setInterval(tick, Math.max(60, 180 - (speed - 1) * 20));
  }

  function pulse() {
    canvas.style.boxShadow = '0 0 30px rgba(74,222,128,.6)';
    setTimeout(() => canvas.style.boxShadow = '', 150);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    // 背景
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,.03)';
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * GRID, 0); ctx.lineTo(i * GRID, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * GRID); ctx.lineTo(canvas.width, i * GRID); ctx.stroke();
    }

    // 食物（发光星形）
    const fx = food.x * GRID + GRID / 2, fy = food.y * GRID + GRID / 2;
    ctx.save();
    ctx.shadowColor = '#f472b6';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#f472b6';
    ctx.beginPath();
    ctx.arc(fx, fy, GRID * 0.32, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fbcfe8';
    ctx.beginPath();
    ctx.arc(fx - 2, fy - 2, GRID * 0.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 蛇身
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const t = i / snake.length;
      ctx.fillStyle = i === 0 ? '#4ade80' : `rgba(34,211,238,${0.9 - t * 0.5})`;
      ctx.shadowColor = i === 0 ? '#4ade80' : 'transparent';
      ctx.shadowBlur = i === 0 ? 10 : 0;
      roundRect(s.x * GRID + 1.5, s.y * GRID + 1.5, GRID - 3, GRID - 3, 6);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // 蛇眼睛
    const h = snake[0];
    ctx.fillStyle = '#052e16';
    const ex = h.x * GRID + GRID / 2, ey = h.y * GRID + GRID / 2;
    const fwd = GRID * 0.2;   // 朝向前方偏移
    const side = GRID * 0.18; // 垂直方向偏移
    const e1 = {x: ex + dir.x * fwd - dir.y * side, y: ey + dir.y * fwd - dir.x * side};
    const e2 = {x: ex + dir.x * fwd + dir.y * side, y: ey + dir.y * fwd + dir.x * side};
    ctx.beginPath();
    ctx.arc(e1.x, e1.y, 2.2, 0, Math.PI * 2);
    ctx.arc(e2.x, e2.y, 2.2, 0, Math.PI * 2);
    ctx.fill();
  }

  function gameOver() {
    clearInterval(timer);
    state = 'over';
    if (score > best) {
      best = score;
      localStorage.setItem('snake_best', best);
      bestEl.textContent = best;
      ovTitle.textContent = '🏆 新纪录！';
    } else {
      ovTitle.textContent = '游戏结束';
    }
    ovScore.style.display = 'block';
    ovScore.textContent = score;
    ovText.innerHTML = '再接再厉，冲击更高分！';
    startBtn.textContent = '再来一局';
    overlay.classList.remove('hidden');
  }

  function start() {
    reset();
    draw();
    overlay.classList.add('hidden');
    state = 'playing';
    restartTimer();
  }

  function pauseToggle() {
    if (state === 'playing') {
      clearInterval(timer);
      state = 'paused';
      ovTitle.textContent = '已暂停';
      ovScore.style.display = 'none';
      ovText.innerHTML = '按空格或点击按钮继续';
      startBtn.textContent = '继续';
      overlay.classList.remove('hidden');
    } else if (state === 'paused') {
      overlay.classList.add('hidden');
      state = 'playing';
      restartTimer();
    }
  }

  // 键盘
  const KEYMAP = {
    ArrowUp: {x:0,y:-1}, ArrowDown: {x:0,y:1}, ArrowLeft: {x:-1,y:0}, ArrowRight: {x:1,y:0},
    w: {x:0,y:-1}, s: {x:0,y:1}, a: {x:-1,y:0}, d: {x:1,y:0},
    W: {x:0,y:-1}, S: {x:0,y:1}, A: {x:-1,y:0}, D: {x:1,y:0}
  };
  document.addEventListener('keydown', e => {
    if (e.key === ' ') {
      e.preventDefault();
      if (state === 'playing' || state === 'paused') pauseToggle();
      else if (state !== 'playing') start();
      return;
    }
    const d = KEYMAP[e.key];
    if (d && state === 'playing') {
      e.preventDefault();
      // 禁止 180 度掉头
      if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
    }
  });

  // 触控滑动
  let tx = 0, ty = 0;
  canvas.addEventListener('touchstart', e => {
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive: true});
  canvas.addEventListener('touchend', e => {
    if (state !== 'playing') return;
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    const d = Math.abs(dx) > Math.abs(dy)
      ? {x: dx > 0 ? 1 : -1, y: 0}
      : {x: 0, y: dy > 0 ? 1 : -1};
    if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
  }, {passive: true});

  startBtn.addEventListener('click', () => {
    if (state === 'paused') pauseToggle();
    else start();
  });

  state = 'idle';
  reset();
  draw();
})();
</script>
</body>
</html>
